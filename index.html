<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งสถานะซ่อมหอพัก สำหรับเจ้าหน้าที่</title>
  
  <!-- Modern Thai Fonts: Prompt & Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --radius: 12px;
      --success: #16a34a;
      --success-hover: #15803d;
      --ease-spring: cubic-bezier(0.2, 0.8, 0.2, 1);
      --font-stack: 'Prompt', 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Sukhumvit Set', 'Thonburi', 'Leelawadee UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-stack);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, select, textarea {
      font-family: var(--font-stack) !important;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 1250px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }

    .dorm-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 24px 0;
    }

    .dorm-card {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
    }

    .dorm-card:hover {
      border-color: #93c5fd;
      background-color: #f0f7ff;
    }

    .dorm-card.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .dorm-card input[type="radio"] {
      display: none;
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dorm-card.selected .radio-circle {
      border-color: var(--primary);
    }

    .dorm-card.selected .radio-circle::after {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .header-chip {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.85rem;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    .btn-back {
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    .tabs-nav {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 18px;
      border: none;
      background: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      background: #f8fafc;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .search-input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      min-width: 200px;
      flex: 1;
      outline: none;
      background: #fff;
    }

    .filter-select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    .btn-sort {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-sort:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .table-responsive {
      overflow-x: hidden;
      border-radius: 8px;
      border: 1px solid var(--border);
      position: relative;
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    th {
      background-color: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      padding: 0;
    }

    td {
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      padding: 0;
    }

    tbody tr.selected-row {
      background-color: #f0fdf4;
    }

    .cell-squeeze {
      padding: 12px 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: padding 0.45s var(--ease-spring), max-width 0.45s var(--ease-spring);
      box-sizing: border-box;
    }

    .mode-update .cell-squeeze {
      padding: 12px 8px;
    }

    .col-w-date     { width: 14%; }
    .col-w-room     { width: 12%; }
    .col-w-cat      { width: 22%; }
    .col-w-detail   { width: 32%; }
    .col-w-status   { width: 20%; }

    .mode-update .col-w-date     { width: 11%; }
    .mode-update .col-w-room     { width: 8%; }
    .mode-update .col-w-cat      { width: 15%; }
    .mode-update .col-w-detail   { width: 18%; }
    .mode-update .col-w-status   { width: 14%; }

    .col-edge {
      border-bottom: 1px solid transparent;
      transition: border-bottom 0.4s ease;
    }

    .col-edge-inner {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      pointer-events: none;
      transition: max-width 0.45s var(--ease-spring),
                  opacity 0.3s ease,
                  transform 0.45s var(--ease-spring),
                  padding 0.45s var(--ease-spring);
      padding: 0;
      box-sizing: border-box;
    }

    .col-left-edge .col-edge-inner {
      transform: translateX(-100vw);
    }

    .col-right-edge .col-edge-inner {
      transform: translateX(100vw);
    }

    .mode-update .col-edge {
      border-bottom: 1px solid var(--border);
    }

    .mode-update .col-left-edge .col-edge-inner {
      max-width: 50px;
      opacity: 1;
      padding: 12px 10px;
      transform: translateX(0);
      pointer-events: auto;
    }

    .mode-update .col-action-status .col-edge-inner {
      max-width: 190px;
      opacity: 1;
      padding: 12px 10px;
      transform: translateX(0);
      pointer-events: auto;
    }

    .mode-update .col-action-date .col-edge-inner {
      max-width: 170px;
      opacity: 1;
      padding: 12px 10px;
      transform: translateX(0);
      pointer-events: auto;
    }

    .col-w-cb           { width: 0%; transition: width 0.45s var(--ease-spring); }
    .col-w-action-stat  { width: 0%; transition: width 0.45s var(--ease-spring); }
    .col-w-action-dt    { width: 0%; transition: width 0.45s var(--ease-spring); }

    .mode-update .col-w-cb          { width: 5%; }
    .mode-update .col-w-action-stat { width: 17%; }
    .mode-update .col-w-action-dt   { width: 15%; }

    .status-badge {
      display: inline-flex;
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .status-received      { background-color: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .status-document      { background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
    .status-in-progress   { background-color: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .status-waiting-parts { background-color: #fef3c7; color: #92400e; border-color: #fde68a; }
    .status-repair        { background-color: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
    .status-completed     { background-color: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .status-reject        { background-color: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .status-unclear       { background-color: #ffedd5; color: #9a3412; border-color: #fed7aa; }
    .status-default       { background-color: #f8fafc; color: #64748b; border-color: #e2e8f0; }

    .bulk-bar {
      margin-top: 18px;
      padding: 0 16px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      transition: all 0.4s var(--ease-spring);
    }

    #main-table-container.mode-update + .bulk-bar {
      max-height: 120px;
      opacity: 1;
      padding: 16px;
      border-color: var(--border);
    }

    .bulk-action-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .select-status, .input-date {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      background: #fff;
      transition: all 0.2s ease;
    }

    .input-date.input-error {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }

    .select-status:disabled, .input-date:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
      border-color: #e2e8f0;
    }

    .btn-bulk-update {
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--success);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-bulk-update:hover {
      background-color: var(--success-hover);
    }

    .btn-bulk-update:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PAGE 1: DORM SELECTION -->
    <div id="page-dorm-select" class="view-section active">
      <h1 style="font-size: 1.35rem; color: var(--primary); margin-bottom: 6px; font-weight: 700;">ระบบแจ้งสถานะซ่อมหอพัก สำหรับเจ้าหน้าที่</h1>
      <p style="font-size: 0.95rem; color: var(--text-muted);">กรุณาเลือกหอพักที่ต้องการดำเนินการ</p>

      <div class="dorm-options">
        <label class="dorm-card" onclick="selectDorm(this, 'หอพักนักศึกษาแพทย์ชาย 14 ชั้น')">
          <input type="radio" name="dorm">
          <span class="radio-circle"></span>
          <span>หอพักนักศึกษาแพทย์ชาย 14 ชั้น</span>
        </label>
        <label class="dorm-card" onclick="selectDorm(this, 'หอพักนักศึกษาแพทย์ชาย 3 (หอพักนักศึกษาแพทย์หญิง 2)')">
          <input type="radio" name="dorm">
          <span class="radio-circle"></span>
          <span>หอพักนักศึกษาแพทย์ชาย 3 (หอพักนักศึกษาแพทย์หญิง 2)</span>
        </label>
        <label class="dorm-card" onclick="selectDorm(this, 'หอพักนักศึกษาแพทย์หญิง 7')">
          <input type="radio" name="dorm">
          <span class="radio-circle"></span>
          <span>หอพักนักศึกษาแพทย์หญิง 7</span>
        </label>
        <label class="dorm-card" onclick="selectDorm(this, 'หอพักนักศึกษาแพทย์หญิง 4/37')">
          <input type="radio" name="dorm">
          <span class="radio-circle"></span>
          <span>หอพักนักศึกษาแพทย์หญิง 4/37</span>
        </label>
        <label class="dorm-card" onclick="selectDorm(this, 'หอพักนักศึกษาแพทย์หญิง Lollipop')">
          <input type="radio" name="dorm">
          <span class="radio-circle"></span>
          <span>หอพักนักศึกษาแพทย์หญิง Lollipop</span>
        </label>
      </div>

      <button class="btn-primary" id="btnContinue" disabled onclick="navigateToDashboard()">ถัดไป</button>
    </div>

    <!-- PAGE 2: DASHBOARD WITH SQUEEZE & SLIDE TRANSITIONS -->
    <div id="page-dashboard" class="view-section">
      <div class="page-header">
        <div>
          <h2 style="font-size: 1.2rem; color: var(--primary); font-weight: 700;">ระบบแจ้งสถานะซ่อมหอพัก สำหรับเจ้าหน้าที่</h2>
          <div class="header-chip" id="selectedDormBadge">หอพัก</div>
        </div>
        <button class="btn-back" onclick="navigateToSelection()">← เปลี่ยนหอพัก</button>
      </div>

      <div class="tabs-nav">
        <button class="tab-btn active" id="tabBtn1" onclick="switchMode('active')">Dashboard ห้องพักทั้งหมด (Active)</button>
        <button class="tab-btn" id="tabBtn2" onclick="switchMode('bulk')">อัปเดตสถานะการซ่อม (Bulk Update)</button>
        <button class="tab-btn" id="tabBtn3" onclick="switchMode('completed')">รายการที่สำเร็จแล้ว (Completed)</button>
      </div>

      <!-- Filter Controls -->
      <div class="filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาเลขห้อง หรือปัญหา..." onkeyup="applyFilters()">
        
        <select id="categoryFilter" class="filter-select" onchange="applyFilters()">
          <option value="">หมวดหมู่ปัญหาทั้งหมด</option>
          <option value="หลอดไฟ">หลอดไฟ</option>
          <option value="เครื่องทำน้ำอุ่น">เครื่องทำน้ำอุ่น</option>
          <option value="เครื่องปรับอากาศ">เครื่องปรับอากาศและคอมเพรสเซอร์</option>
          <option value="ระบบประปา">ระบบประปา / ท่อน้ำ / สายชำระ</option>
          <option value="มู่ลี่">มู่ลี่</option>
          <option value="ผนังและโครงสร้าง">ผนังและโครงสร้าง</option>
          <option value="เฟอร์นิเจอร์">เฟอร์นิเจอร์และกระจก</option>
          <option value="อื่น">อื่น ๆ</option>
        </select>

        <select id="statusFilter" class="filter-select" onchange="applyFilters()">
          <!-- Populated dynamically based on tab -->
        </select>

        <button class="btn-sort" id="sortBtn" onclick="toggleSort()">
          <span id="sortIcon">⏱️</span> เรียงตามเวลา: <span id="sortText">นานสุด ➔ ล่าสุด</span>
        </button>

        <span id="statusSummary" style="font-size: 0.85rem; color: var(--text-muted); margin-left: auto;">กำลังโหลด...</span>
      </div>

      <!-- Table Structure with Dynamic Col Widths and Smooth Squeeze -->
      <div class="table-responsive" id="main-table-container">
        <table>
          <colgroup>
            <col class="col-w-cb">
            <col class="col-w-date">
            <col class="col-w-room">
            <col class="col-w-cat">
            <col class="col-w-detail">
            <col class="col-w-status">
            <col class="col-w-action-stat">
            <col class="col-w-action-dt">
          </colgroup>
          <thead>
            <tr>
              <!-- Left Edge Slide: Checkbox -->
              <th class="col-edge col-left-edge">
                <div class="col-edge-inner" style="text-align: center;">
                  <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
                </div>
              </th>
              
              <!-- Squeezed Central Columns -->
              <th><div class="cell-squeeze" id="dateHeaderTitle">วันที่อัปเดต</div></th>
              <th><div class="cell-squeeze">ห้อง</div></th>
              <th><div class="cell-squeeze">หมวดหมู่ / ปัญหา</div></th>
              <th><div class="cell-squeeze">รายละเอียด</div></th>
              <th><div class="cell-squeeze">สถานะ</div></th>

              <!-- Right Edge Slide: Actions -->
              <th class="col-edge col-right-edge col-action-status">
                <div class="col-edge-inner">เลือกสถานะใหม่</div>
              </th>
              <th class="col-edge col-right-edge col-action-date">
                <div class="col-edge-inner">วันที่ช่างเข้าห้อง <span style="color: #ef4444;">*</span></div>
              </th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" style="text-align:center; padding: 24px; color: var(--text-muted);">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Bulk Action Bar -->
      <div class="bulk-bar" id="bulkBar">
        <div class="bulk-action-controls">
          <span style="font-size: 0.9rem; font-weight: 600;">เปลี่ยนสถานะทุกแถวที่เลือกพร้อมกัน:</span>
          <select id="bulkStatusSelect" class="select-status" style="width: auto;" onchange="applyStatusToSelected(this.value)">
            <option value="">-- เลือกสถานะส่วนกลาง --</option>
            <option value="แจ้งซ่อมในระบบแล้ว">แจ้งซ่อมในระบบแล้ว</option>
            <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
            <option value="รอเบิกอะไหล่">รอเบิกอะไหล่</option>
            <option value="ช่างจะเข้าซ่อมในห้อง">ช่างจะเข้าซ่อมในห้อง</option>
            <option value="สำเร็จ">สำเร็จ</option>
            <option value="ไม่รับคำร้อง">ไม่รับคำร้อง</option>
            <option value="คำร้องไม่ชัดเจน">คำร้องไม่ชัดเจน</option>
          </select>
          <input type="date" id="bulkDateInput" class="input-date" style="display: none; width: auto;" title="ระบุวันที่ช่างจะเข้าห้องพร้อมกัน" onchange="applyDateToSelected(this.value)">
        </div>

        <button id="btnSubmitBulk" class="btn-bulk-update" disabled onclick="submitBulkStatusUpdates()">
          บันทึกการอัปเดตสถานะ
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentDorm = "";
    let activeRoomsData = [];
    let currentMode = "active";
    let currentSortOrder = 'asc';

    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxPW-8OMeJjTeuFnZa6_yIKG6GnMqlxmYnU6wnCif_fbpCAfRewV63c32G0U3jGyP-_JA/exec";

    function formatThaiDisplayDate(dateStr) {
      if (!dateStr) return "";
      try {
        const clean = String(dateStr).trim();
        const parts = clean.split("-");
        if (parts.length === 3) {
          const yr = parseInt(parts[0], 10);
          const thYr = yr > 2400 ? yr : yr + 543;
          return `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}/${String(thYr).slice(-2)}`;
        }
      } catch (e) {}
      return dateStr;
    }

    function formatDaysAgo(timestamp) {
      if (!timestamp) return '-';
      const clean = String(timestamp).replace(/^SENT\s*\(\s*/i, "").replace(/\)$/, "").trim();
      let parts = clean.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      let ticketDate;
      if (parts) {
        let yr = parseInt(parts[3], 10);
        if (yr > 2400) yr -= 543;
        ticketDate = new Date(yr, parseInt(parts[2], 10) - 1, parseInt(parts[1], 10));
      } else {
        ticketDate = new Date(clean);
      }

      if (isNaN(ticketDate.getTime())) return String(timestamp);

      const d = ticketDate.getDate();
      const m = ticketDate.getMonth() + 1;
      let yr = ticketDate.getFullYear();
      let thYear = yr > 2400 ? yr : yr + 543;
      let yrShort = String(thYear).slice(-2);
      const dateStr = `${d}/${m}/${yrShort}`;

      const now = new Date();
      const diffMs = now.getTime() - ticketDate.getTime();
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      let agoStr = diffDays <= 0 ? 'วันนี้' : `${diffDays} วันที่แล้ว`;
      return `<div style="white-space: nowrap; font-weight: 500;">${dateStr}</div><div style="white-space: nowrap; font-size: 0.75rem; color: #94a3b8; margin-top: 2px;">${agoStr}</div>`;
    }

    function getBadgeClass(status) {
      if (!status) return 'status-default';
      const s = status.trim();
      if (s.includes('ได้รับคำร้องแล้ว')) return 'status-received';
      if (s.includes('แจ้งซ่อมในระบบแล้ว')) return 'status-document';
      if (s.includes('กำลังดำเนินการ')) return 'status-in-progress';
      if (s.includes('รอเบิกอะไหล่')) return 'status-waiting-parts';
      if (s.includes('ช่างจะเข้าซ่อมในห้อง')) return 'status-repair';
      if (s.includes('สำเร็จ')) return 'status-completed';
      if (s.includes('ไม่รับคำร้อง')) return 'status-reject';
      if (s.includes('คำร้องไม่ชัดเจน')) return 'status-unclear';
      return 'status-default';
    }

    function selectDorm(cardElement, dormName) {
      document.querySelectorAll('.dorm-card').forEach(c => c.classList.remove('selected'));
      cardElement.classList.add('selected');
      cardElement.querySelector('input').checked = true;
      currentDorm = dormName;
      document.getElementById('btnContinue').disabled = false;
    }

    function navigateToDashboard() {
      if (!currentDorm) return;
      document.getElementById('page-dorm-select').classList.remove('active');
      document.getElementById('page-dashboard').classList.add('active');
      document.getElementById('selectedDormBadge').textContent = currentDorm;
      switchMode('active');
      loadActiveStatusData();
    }

    function navigateToSelection() {
      document.getElementById('page-dashboard').classList.remove('active');
      document.getElementById('page-dorm-select').classList.add('active');
    }

    function updateStatusFilterDropdown() {
      const select = document.getElementById('statusFilter');
      if (currentMode === 'completed') {
        select.innerHTML = `
          <option value="">สถานะทั้งหมด</option>
          <option value="สำเร็จ">สำเร็จ</option>
        `;
      } else {
        select.innerHTML = `
          <option value="">สถานะปัจจุบันทั้งหมด</option>
          <option value="ได้รับคำร้องแล้ว">ได้รับคำร้องแล้ว</option>
          <option value="แจ้งซ่อมในระบบแล้ว">แจ้งซ่อมในระบบแล้ว</option>
          <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
          <option value="รอเบิกอะไหล่">รอเบิกอะไหล่</option>
          <option value="ช่างจะเข้าซ่อมในห้อง">ช่างจะเข้าซ่อมในห้อง</option>
          <option value="คำร้องไม่ชัดเจน">คำร้องไม่ชัดเจน</option>
        `;
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const tab1 = document.getElementById('tabBtn1');
      const tab2 = document.getElementById('tabBtn2');
      const tab3 = document.getElementById('tabBtn3');
      const container = document.getElementById('main-table-container');

      [tab1, tab2, tab3].forEach(b => b.classList.remove('active'));

      if (mode === 'active') {
        tab1.classList.add('active');
        container.classList.remove('mode-update');
      } else if (mode === 'bulk') {
        tab2.classList.add('active');
        container.classList.add('mode-update');
      } else if (mode === 'completed') {
        tab3.classList.add('active');
        container.classList.remove('mode-update');
      }

      updateStatusFilterDropdown();
      applyFilters();
    }

    async function loadActiveStatusData() {
      try {
        if (API_ENDPOINT.includes('YOUR_DEPLOYMENT_ID')) {
          activeRoomsData = [];
        } else {
          const res = await fetch(`${API_ENDPOINT}?dorm=${encodeURIComponent(currentDorm)}`);
          const fetched = await res.json();
          activeRoomsData = (fetched || []).map(item => ({ 
            ...item, 
            isChecked: false, 
            newStatus: '', 
            appointmentDate: item.appointmentDate ? String(item.appointmentDate).trim() : ''
          }));
        }
        applyFilters();
      } catch (err) {
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="8" style="color:red; text-align:center; padding: 24px;">โหลดข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
      }
    }

    function parseToMillis(val) {
      if (!val) return 0;
      let s = String(val).replace(/^SENT\s*\(\s*/i, "").replace(/\)$/, "").trim();
      if (s.includes("|")) s = s.split("|")[0].trim();

      const iso = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[T\s](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
      if (iso) {
        let y = parseInt(iso[1], 10);
        if (y > 2400) y -= 543;
        return new Date(y, parseInt(iso[2], 10) - 1, parseInt(iso[3], 10), parseInt(iso[4] || 0), parseInt(iso[5] || 0), parseInt(iso[6] || 0)).getTime();
      }

      const slash = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})(?:[T\s](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
      if (slash) {
        const p1 = parseInt(slash[1], 10);
        const p2 = parseInt(slash[2], 10);
        let yr = parseInt(slash[3], 10);
        if (yr < 100) yr += 2000;
        if (yr > 2400) yr -= 543;
        let d = p1, m = p2 - 1;
        if (p1 > 12 && p2 <= 12) { d = p1; m = p2 - 1; }
        else if (p2 > 12 && p1 <= 12) { d = p2; m = p1 - 1; }
        return new Date(yr, m, d, parseInt(slash[4] || 0), parseInt(slash[5] || 0), parseInt(slash[6] || 0)).getTime();
      }

      const d = new Date(s);
      return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    function compareTimestamps(a, b, order = 'asc') {
      const timeA = parseToMillis(a.timestamp);
      const timeB = parseToMillis(b.timestamp);

      if (timeA !== 0 && timeB !== 0) {
        return order === 'asc' ? timeA - timeB : timeB - timeA;
      }
      return order === 'asc' 
        ? String(a.timestamp || '').localeCompare(String(b.timestamp || ''))
        : String(b.timestamp || '').localeCompare(String(a.timestamp || ''));
    }

    function toggleSort() {
      currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
      document.getElementById('sortText').textContent = currentSortOrder === 'asc' ? 'นานสุด ➔ ล่าสุด' : 'ล่าสุด ➔ นานสุด';
      applyFilters();
    }

    function applyFilters() {
      const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const cat = (document.getElementById('categoryFilter').value || '').toLowerCase().trim();
      const stat = (document.getElementById('statusFilter').value || '').toLowerCase().trim();

      let filtered = activeRoomsData.filter(item => {
        const currentStat = String(item.activeStatus || "").trim();

        // Mode-specific filtering:
        if (currentMode === 'active' || currentMode === 'bulk') {
          // Exclude completed and rejected
          if (currentStat.includes("สำเร็จ") || currentStat.includes("ไม่รับคำร้อง")) {
            return false;
          }
        } else if (currentMode === 'completed') {
          // Show only completed
          if (!currentStat.includes("สำเร็จ")) {
            return false;
          }
        }

        const textMatch = !search || 
          (item.roomNumber || '').toLowerCase().includes(search) || 
          (item.category || '').toLowerCase().includes(search) || 
          (item.detail || '').toLowerCase().includes(search);
        
        const catMatch = !cat || (item.category || '').toLowerCase().includes(cat);
        const statMatch = !stat || currentStat.toLowerCase().includes(stat);

        return textMatch && catMatch && statMatch;
      });

      filtered.sort((a, b) => {
        if (currentMode === 'bulk' && a.isChecked !== b.isChecked) {
          return a.isChecked ? -1 : 1;
        }
        return compareTimestamps(a, b, currentSortOrder);
      });

      renderTable(filtered);
    }

    function renderTable(dataList) {
      const tbody = document.getElementById('tableBody');
      const summary = document.getElementById('statusSummary');

      if (currentMode === 'bulk') {
        const checkedCount = activeRoomsData.filter(i => i.isChecked).length;
        summary.textContent = `เลือกแล้ว ${checkedCount} รายการ`;
      } else {
        summary.textContent = `พบ ${dataList.length} รายการ`;
      }

      if (!dataList || dataList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:24px; color: var(--text-muted);">ไม่พบรายการที่ตรงกับเงื่อนไข</td></tr>';
        updateSelectionUI();
        return;
      }

      tbody.innerHTML = dataList.map(item => {
        const isRepairActive = item.isChecked && item.newStatus === 'ช่างจะเข้าซ่อมในห้อง';
        const isMissingDate = isRepairActive && !item.appointmentDate;
        
        let apptBadge = '';
        if (item.appointmentDate) {
          apptBadge = `<div style="font-size: 0.72rem; color: #9a3412; background: #ffedd5; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; font-weight: 600; border: 1px solid #fed7aa; white-space: nowrap;">📅 นัดล่าสุด: ${formatThaiDisplayDate(item.appointmentDate)}</div>`;
        }

        return `
        <tr id="row-${item.id}" class="${item.isChecked && currentMode === 'bulk' ? 'selected-row' : ''}">
          <!-- Left Edge Slide-In Checkbox -->
          <td class="col-edge col-left-edge">
            <div class="col-edge-inner" style="text-align: center;">
              <input type="checkbox" class="row-checkbox" data-id="${item.id}" ${item.isChecked ? 'checked' : ''} onchange="handleRowCheckboxChange(this)">
            </div>
          </td>

          <!-- Squeezed Central Columns -->
          <td><div class="cell-squeeze"><span style="font-size: 0.85rem; color: var(--text);">${formatDaysAgo(item.timestamp)}</span></div></td>
          <td><div class="cell-squeeze"><strong>${item.roomNumber || '-'}</strong></div></td>
          <td><div class="cell-squeeze">${item.category || '-'}</div></td>
          <td><div class="cell-squeeze" title="${item.detail || ''}">${item.detail || '-'}</div></td>
          <td>
            <div class="cell-squeeze">
              <span class="status-badge ${getBadgeClass(item.activeStatus)}">${item.activeStatus || '-'}</span>
              ${apptBadge}
            </div>
          </td>

          <!-- Right Edge Slide-In Status -->
          <td class="col-edge col-right-edge col-action-status">
            <div class="col-edge-inner">
              <select class="select-status row-status-select" data-id="${item.id}" ${!item.isChecked ? 'disabled' : ''} onchange="handleRowStatusChange('${item.id}', this.value)">
                <option value="">-- เลือกสถานะใหม่ --</option>
                <option value="แจ้งซ่อมในระบบแล้ว" ${item.newStatus === 'แจ้งซ่อมในระบบแล้ว' ? 'selected' : ''}>แจ้งซ่อมในระบบแล้ว</option>
                <option value="กำลังดำเนินการ" ${item.newStatus === 'กำลังดำเนินการ' ? 'selected' : ''}>กำลังดำเนินการ</option>
                <option value="รอเบิกอะไหล่" ${item.newStatus === 'รอเบิกอะไหล่' ? 'selected' : ''}>รอเบิกอะไหล่</option>
                <option value="ช่างจะเข้าซ่อมในห้อง" ${item.newStatus === 'ช่างจะเข้าซ่อมในห้อง' ? 'selected' : ''}>ช่างจะเข้าซ่อมในห้อง</option>
                <option value="สำเร็จ" ${item.newStatus === 'สำเร็จ' ? 'selected' : ''}>สำเร็จ</option>
                <option value="ไม่รับคำร้อง" ${item.newStatus === 'ไม่รับคำร้อง' ? 'selected' : ''}>ไม่รับคำร้อง</option>
                <option value="คำร้องไม่ชัดเจน" ${item.newStatus === 'คำร้องไม่ชัดเจน' ? 'selected' : ''}>คำร้องไม่ชัดเจน</option>
              </select>
            </div>
          </td>

          <!-- Right Edge Slide-In Date -->
          <td class="col-edge col-right-edge col-action-date">
            <div class="col-edge-inner">
              <input type="date" id="date-input-${item.id}" class="input-date row-date-input ${isMissingDate ? 'input-error' : ''}" data-id="${item.id}" value="${item.appointmentDate || ''}" ${!isRepairActive ? 'disabled' : ''} onchange="handleRowDateChange('${item.id}', this.value)">
            </div>
          </td>
        </tr>
      `}).join('');

      updateSelectionUI();
    }

    function handleRowCheckboxChange(cb) {
      const id = String(cb.dataset.id);
      const target = activeRoomsData.find(i => String(i.id) === id);
      
      if (target) {
        target.isChecked = cb.checked;
        if (!cb.checked) {
          target.newStatus = '';
        }
      }
      applyFilters();
    }

    function handleRowStatusChange(id, value) {
      const target = activeRoomsData.find(i => String(i.id) === String(id));
      if (target) {
        target.newStatus = value;
        if (value && !target.isChecked) {
          target.isChecked = true;
        }
      }
      applyFilters();
      
      if (value === 'ช่างจะเข้าซ่อมในห้อง' && !target.appointmentDate) {
        setTimeout(() => {
          const dateInput = document.getElementById(`date-input-${id}`);
          if (dateInput) dateInput.focus();
        }, 50);
      }
    }

    function handleRowDateChange(id, dateValue) {
      const target = activeRoomsData.find(i => String(i.id) === String(id));
      if (target) {
        target.appointmentDate = dateValue;
      }
      const inputEl = document.getElementById(`date-input-${id}`);
      if (inputEl) {
        if (dateValue) {
          inputEl.classList.remove('input-error');
        } else {
          inputEl.classList.add('input-error');
        }
      }
    }

    function toggleSelectAll(masterCb) {
      const visibleCheckboxes = document.querySelectorAll('#tableBody .row-checkbox');
      const visibleIds = Array.from(visibleCheckboxes).map(cb => String(cb.dataset.id));

      activeRoomsData.forEach(item => {
        if (visibleIds.includes(String(item.id))) {
          item.isChecked = masterCb.checked;
          if (!masterCb.checked) {
            item.newStatus = '';
          }
        }
      });
      applyFilters();
    }

    function applyStatusToSelected(statusVal) {
      const bulkDateInput = document.getElementById('bulkDateInput');
      if (statusVal === 'ช่างจะเข้าซ่อมในห้อง') {
        bulkDateInput.style.display = 'inline-block';
        bulkDateInput.focus();
      } else {
        bulkDateInput.style.display = 'none';
        bulkDateInput.value = '';
      }

      if (!statusVal) return;
      activeRoomsData.forEach(item => {
        if (item.isChecked) {
          item.newStatus = statusVal;
        }
      });
      applyFilters();
    }

    function applyDateToSelected(dateVal) {
      activeRoomsData.forEach(item => {
        if (item.isChecked && item.newStatus === 'ช่างจะเข้าซ่อมในห้อง') {
          item.appointmentDate = dateVal;
        }
      });
      applyFilters();
    }

    function updateSelectionUI() {
      const checkedCount = activeRoomsData.filter(i => i.isChecked).length;
      document.getElementById('btnSubmitBulk').disabled = checkedCount === 0;
      
      const selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) {
        const visibleCheckboxes = document.querySelectorAll('#tableBody .row-checkbox');
        const checkedVisible = document.querySelectorAll('#tableBody .row-checkbox:checked');
        selectAllCb.checked = visibleCheckboxes.length > 0 && checkedVisible.length === visibleCheckboxes.length;
      }
    }

    async function submitBulkStatusUpdates() {
      const checkedItems = activeRoomsData.filter(item => item.isChecked && item.newStatus);

      if (checkedItems.length === 0) {
        alert('กรุณาเลือกสถานะใหม่สำหรับรายการที่ติ๊กเลือกอย่างน้อย 1 รายการ');
        return;
      }

      const missingDateItem = checkedItems.find(item => item.newStatus === 'ช่างจะเข้าซ่อมในห้อง' && !item.appointmentDate);
      if (missingDateItem) {
        alert(`❌ ไม่สามารถบันทึกได้:\nกรุณาระบุ "วันที่ช่างจะเข้าห้อง" สำหรับห้อง ${missingDateItem.roomNumber || '-'}`);
        
        const errorInput = document.getElementById(`date-input-${missingDateItem.id}`);
        if (errorInput) {
          errorInput.classList.add('input-error');
          errorInput.focus();
        }
        return;
      }

      const updates = checkedItems.map(item => ({ 
        id: item.id, 
        newStatus: item.newStatus, 
        appointmentDate: item.newStatus === 'ช่างจะเข้าซ่อมในห้อง' ? item.appointmentDate : null
      }));

      const btn = document.getElementById('btnSubmitBulk');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      try {
        const payload = JSON.stringify({ dorm: currentDorm, updates: updates });

        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
          },
          body: payload
        });

        const result = await response.json();

        if (result && result.status === 'success') {
          alert(`อัปเดตสถานะสำเร็จ ${updates.length} รายการ`);
          await loadActiveStatusData();
        } else {
          throw new Error(result.message || 'การอัปเดตล้มเหลว');
        }
      } catch (err) {
        alert(`เกิดข้อผิดพลาดในการอัปเดต: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'บันทึกการอัปเดตสถานะ';
      }
    }
  </script>
</body>
